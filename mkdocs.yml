site_name: Mimesis Documentation
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: deep purple
  icon:
    logo: octicons/squirrel-16

nav:
  - Home: index.md
  - Environment:
      - Plugins Configurations: PluginsInstallation.md
  - Plugins:
      - Agent AI: Agent_IA.md
      - LLM Websocket: Conversational_Generative_AI.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
